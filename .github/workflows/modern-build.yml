name: Modern build

on:
  push:
  workflow_dispatch:

jobs:
  client-features:
    name: Agent + mod Fabric (prismfeatures.jar)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        working-directory: client-features
        shell: bash
        run: |
          set +e
          sh build-all.sh > ../build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error:|error |FAILED|What went wrong|Could not|Execution failed|not found|No such" -A2 ../build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=build-fabric::$msg"
            tail -n 40 ../build.log | head -c 3000 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=tail-fabric::/'
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: prismfeatures
          path: client-features/agent/build/libs/*.jar

  launcher:
    name: Launcher (Linux, Qt6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build extra-cmake-modules g++ \
            qt6-base-dev qt6-base-private-dev qt6-5compat-dev qt6-networkauth-dev \
            libgl1-mesa-dev libcmark-dev libtomlplusplus-dev libquazip1-qt6-dev \
            zlib1g-dev libqrencode-dev libarchive-dev scdoc openjdk-17-jdk
      - name: Configurer
        shell: bash
        run: |
          set +e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLauncher_QT_VERSION_MAJOR=6 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -n 30 build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=cmake-configure::/'
          fi
          exit $rc
      - name: Compiler
        shell: bash
        run: |
          set +e
          cmake --build build -k 0 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "error:|Error " -A3 build.log | head -c 3800 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=compile::/'
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
