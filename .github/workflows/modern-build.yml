name: Modern build

on:
  push:
  workflow_dispatch:

jobs:
  client-features:
    name: Mod ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.1',  yarn: '1.21.1+build.3',  compat: v1211 }
          - { mc: '1.21.4',  yarn: '1.21.4+build.8',  compat: legacy }
          - { mc: '1.21.5',  yarn: '1.21.5+build.1',  compat: legacy }
          - { mc: '1.21.8',  yarn: '1.21.8+build.1',  compat: mid }
          - { mc: '1.21.10', yarn: '1.21.10+build.3', compat: new }
          - { mc: '1.21.11', yarn: '1.21.11+build.6', compat: new }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build
        working-directory: client-features
        shell: bash
        run: |
          set +e
          sh build-all.sh ${{ matrix.mc }} ${{ matrix.yarn }} ${{ matrix.compat }} > ../build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error:|error |FAILED|What went wrong|Could not|Execution failed|not found|No such" -A2 ../build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=build-${{ matrix.mc }}::$msg"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.mc }}
          path: client-features/agent/src/main/resources/payloads/*.jar

  mod-26:
    name: Mod ${{ matrix.mc }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '26.1', compat: a }
          - { mc: '26.2', compat: b }
          - { mc: '26.3', compat: b }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Build
        working-directory: client-features-26
        shell: bash
        run: |
          set +e
          gradle build -Pminecraft_version=${{ matrix.mc }} -Pcompat=${{ matrix.compat }} > ../build26.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "error:" -A1 ../build26.log | grep -v "^--" | paste -sd'|' | head -c 9000 | sed 's/%/%25/g' | sed 's/^/::error title=err26::/'
            grep -E "What went wrong|Could not|not found" -A3 ../build26.log | head -c 1500 | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error title=gradle26::/'
            exit $rc
          fi
          mkdir -p ../payloads-out
          cp build/libs/prismfeatures-fabric-*.jar ../payloads-out/fabric-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: payload-${{ matrix.mc }}
          path: payloads-out/*.jar

  launcher:
    name: Launcher (Linux, Qt6)
    needs: [client-features, mod-26]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          merge-multiple: true
          path: payloads
      - name: Embarquer le mod dans l'exécutable
        run: |
          mkdir -p launcher/resources/features
          cp payloads/*.jar launcher/resources/features/
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qt5compat qtnetworkauth'
          cache: true
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build extra-cmake-modules g++ \
            libgl1-mesa-dev libxkbcommon-dev cmark libcmark-dev libtomlplusplus-dev libquazip1-qt6-dev \
            zlib1g-dev libqrencode-dev libarchive-dev scdoc openjdk-17-jdk
      - name: libnbtplusplus
        run: git clone --depth 1 https://github.com/PrismLauncher/libnbtplusplus.git libraries/libnbtplusplus
      - name: Configurer
        shell: bash
        run: |
          set +e
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLauncher_QT_VERSION_MAJOR=6 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -n 30 build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=cmake-configure::/'
          fi
          exit $rc
      - name: Compiler
        shell: bash
        run: |
          set +e
          cmake --build build -- -k 0 > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            ( grep -E "error:|Error |FAILED|rror" -A3 build.log | head -c 3300; echo; echo ---TAIL---; tail -n 8 build.log | head -c 500 ) | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=compile::/'
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

  windows:
    name: Launcher (Windows .exe)
    needs: [client-features, mod-26]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      BUILD_TYPE: Release
      CMAKE_PRESET: windows_msvc
    steps:
      - uses: actions/checkout@v4
      - name: libnbtplusplus
        run: git clone --depth 1 https://github.com/PrismLauncher/libnbtplusplus.git libraries/libnbtplusplus
      - name: vcpkg
        run: |
          rm -rf cmake/vcpkg
          git clone --depth 1 https://github.com/microsoft/vcpkg.git cmake/vcpkg
      - uses: actions/download-artifact@v4
        with:
          pattern: payload-*
          merge-multiple: true
          path: payloads
      - name: Embarquer le mod dans l'exécutable
        run: cp payloads/*.jar launcher/resources/features/
      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: Release
          artifact-name: Windows-MSVC
          vcvars-arch: amd64
          qt-version: 6.11.2
      - name: Configurer
        run: |
          set +e
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            tail -n 40 build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=win-configure::/'
          fi
          exit $rc
      - name: Compiler
        run: |
          set +e
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE" > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            ( grep -E "error|FAILED" -A3 build.log | head -c 3300; echo; echo ---TAIL---; tail -n 8 build.log | head -c 500 ) | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | sed 's/^/::error title=win-compile::/'
          fi
          exit $rc
      - name: Installer dans un dossier
        run: cmake --install build --config Release --prefix install
      - name: Installeur unique (Setup.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$env:GITHUB_WORKSPACE\install" "/DOutDir=$env:GITHUB_WORKSPACE\dist" "$env:GITHUB_WORKSPACE\scripts\prism-modern.iss"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=inno::ISCC exit $LASTEXITCODE"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Setup
          path: dist/PrismLauncher-Setup.exe
