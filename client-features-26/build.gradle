plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
base { archivesName = 'prismfeatures-fabric' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

sourceSets.main.java.srcDir "src/compat/${project.compat}/java"
processResources { from("../lang") { into "prismlang" } }

tasks.withType(JavaCompile).configureEach { options.release = 25; options.compilerArgs << '-Xmaxerrs' << '1000' }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
